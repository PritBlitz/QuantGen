# QuantGen production-style stack (PRD M6, ARCHITECTURE §11).
#
#   cp .env.example .env            # then set real secrets (never commit .env)
#   docker compose up -d --build
#   open http://localhost:${QG_WEB_PORT:-8088}
#
# Only the web container is published. nginx serves the SPA and reverse-proxies /api and /ws
# to the API, so the browser sees one origin (no CORS). Postgres and the API stay on the
# private network. Secrets have no defaults here: compose refuses to start without them.

name: quantgen

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantgen}
      POSTGRES_USER: ${POSTGRES_USER:-quantgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: ./backend-quant
    image: ${QG_IMAGE_PREFIX:-quantgen}-api:${QG_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "demo" seeds the PRD §10 demo users; drop it for a clean bank.
      SPRING_PROFILES_ACTIVE: ${QG_SPRING_PROFILES:-prod,demo}
      # Change these on any public deployment (the defaults are published in the README).
      QG_DEMO_ADMIN_PASSWORD: ${QG_DEMO_ADMIN_PASSWORD:-Admin@1234}
      QG_DEMO_USER_PASSWORD: ${QG_DEMO_USER_PASSWORD:-Demo@1234}
      QG_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-quantgen}
      QG_DB_USER: ${POSTGRES_USER:-quantgen}
      QG_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      QG_JWT_SECRET: ${QG_JWT_SECRET:?set QG_JWT_SECRET in .env (openssl rand -base64 48)}
      # Field-level encryption for KYC/card data (D-032). Two different values; losing
      # QG_FIELD_KEY makes stored PANs unreadable. Each: openssl rand -base64 32
      QG_FIELD_KEY: ${QG_FIELD_KEY:?set QG_FIELD_KEY in .env (openssl rand -base64 32)}
      QG_INDEX_KEY: ${QG_INDEX_KEY:?set QG_INDEX_KEY in .env (openssl rand -base64 32)}
      # Same-origin through nginx; only needed if the SPA is served from elsewhere.
      QG_CORS_ORIGINS: ${QG_CORS_ORIGINS:-http://localhost:8088}
      TZ: UTC
    volumes:
      # Loan documents (PRD §12.8). The image creates this dir owned by uid 10001, and a fresh
      # named volume copies that ownership, so uploads survive a redeploy.
      - loandocs:/app/data/loan-documents
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 10
    networks: [backend, edge]

  web:
    build: ./frontend-quant
    image: ${QG_IMAGE_PREFIX:-quantgen}-web:${QG_TAG:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      QG_API_UPSTREAM: api:8080
    ports:
      - "${QG_WEB_BIND:-127.0.0.1}:${QG_WEB_PORT:-8088}:8080"
    networks: [edge]
    read_only: true
    # Owned by the image's unprivileged nginx user (101); a root-owned tmpfs leaves nginx
    # unable to render its config template, and it then starts serving nothing.
    tmpfs:
      - /tmp:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Observability (PRD F-OPS-1), opt-in: docker compose --profile observability up -d
  # Prometheus scrapes /actuator/prometheus over the private network. Grafana is the only one
  # published, on loopback by default, at http://localhost:${QG_GRAFANA_PORT:-3001}.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [backend, obs]
    security_opt: ["no-new-privileges:true"]

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:12.1.0
    restart: unless-stopped
    depends_on: [prometheus]
    # Not ":?" in the variable: compose interpolates every service even when this profile is off,
    # so a required variable would break a plain `docker compose up`. Refuse to start here instead,
    # never with Grafana's admin/admin default.
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'set QG_GRAFANA_PASSWORD in .env' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${QG_GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      # Own bind, not QG_WEB_BIND: a server sets that to 0.0.0.0, and Grafana must stay private (use an SSH tunnel).
      - "${QG_GRAFANA_BIND:-127.0.0.1}:${QG_GRAFANA_PORT:-3001}:3000"
    networks: [obs]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    internal: true
  edge: {}
  obs: {}

volumes:
  pgdata:
  loandocs:
  promdata:
  grafanadata:
