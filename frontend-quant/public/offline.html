<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QuantGen · Offline</title>
    <style>
      :root {
        --bg: #0a0b0d;
        --surface: #111317;
        --border: #23272f;
        --text: #edeef0;
        --muted: #8a909c;
        --accent: #d2ff3a;
        --accent-ink: #0a0b0d;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f3ef;
          --surface: #ffffff;
          --border: #ddd8cf;
          --text: #121316;
          --muted: #5e6470;
          --accent: #3350e6;
          --accent-ink: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 20px 0 8px;
        font: 400 2.5rem/1.1 Georgia, 'Times New Roman', serif;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You’re offline.</h1>
      <p>
        QuantGen needs a connection to show balances and move money, so nothing is stored on this
        device. Your money is safe; reconnect and try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
