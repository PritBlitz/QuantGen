# Dev profile: local Postgres from ../docker-compose.dev.yml (port 5433).
# Credentials and secrets here are DEV-ONLY defaults.
spring:
  datasource:
    url: ${QG_DB_URL:jdbc:postgresql://localhost:5433/quantgen}
    username: ${QG_DB_USER:quantgen}
    password: ${QG_DB_PASSWORD:quantgen}

qg:
  agent:
    # Dev-only default; agent-quant's dev profile uses the same value. Prod reads QG_AGENT_SECRET.
    secret: ${QG_AGENT_SECRET:dev-only-agent-secret-do-not-use-in-prod}
  jwt:
    # Dev-only default. Prod reads QG_JWT_SECRET from the environment.
    secret: ${QG_JWT_SECRET:ZGV2LW9ubHktcXVhbnRnZW4tand0LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtMDEyMzQ1Njc4OQ==}
  crypto:
    # Dev-only keys. Prod reads QG_FIELD_KEY / QG_INDEX_KEY (base64 of 32 random bytes) and has no default.
    field-key: ${QG_FIELD_KEY:ZGV2LW9ubHktZmllbGQta2V5LWRvLW5vdC11c2UhISE=}
    index-key: ${QG_INDEX_KEY:ZGV2LW9ubHktaW5kZXgta2V5LWRvLW5vdC11c2UhISE=}
