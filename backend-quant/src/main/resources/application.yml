spring:
  application:
    name: backend-quant
  autoconfigure:
    # Login is handled by AuthService (with lockout); no in-memory/generated user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    deserialization:
      # Reject 1.5 for an integer field (e.g. order quantity) instead of silently truncating it.
      accept-float-as-int: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Loan documents are capped at 5 MB in LoanDocumentService; this only stops absurd bodies early.
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.quantgen

qg:
  agent:
    # agent-quant (D-044, D-045). The shared secret has no default outside dev: without it every turn is refused.
    url: ${QG_AGENT_URL:http://localhost:8090}
    secret: ${QG_AGENT_SECRET:}
  ai:
    # D-039 budgets in tokens (free tier: prices 0, so cost is 0).
    user-daily-tokens: ${QG_AI_USER_DAILY_TOKENS:200000}
    monthly-tokens: ${QG_AI_MONTHLY_TOKENS:5000000}
  proofs:
    anchor:
      # F-POB-6: a local clone of the public repo that holds the daily roots (blank = off). Commits only; the owner pushes.
      repo-dir: ${QG_ANCHOR_REPO_DIR:}
      # Its public URL, shown as roots[].anchor.repo (blank = no anchor shown).
      repo-url: ${QG_ANCHOR_REPO_URL:}
  market:
    simulator-enabled: true
    tick-millis: 3000
    sync:
      # D-047: fetch NSE's end-of-day file daily for the 14 real symbols and anchor live prices to it.
      # The first complete run moves live prices to real levels (cancels open orders on them, pauses price rules).
      enabled: ${QG_MARKET_SYNC_ENABLED:false}
      base-url: https://nsearchives.nseindia.com/content/cm/
      pause-millis: 1500
  cors:
    allowed-origins: ${QG_CORS_ORIGINS:http://localhost:5173}
  demo:
    # Used only by the dev/demo seeder (DemoDataSeeder). Change both on any public deployment.
    admin-password: ${QG_DEMO_ADMIN_PASSWORD:Admin@1234}
    user-password: ${QG_DEMO_USER_PASSWORD:Demo@1234}
  webauthn:
    # Must be the domain the SPA is served from (localhost in dev). Allowed origins are qg.cors.allowed-origins.
    rp-id: ${QG_WEBAUTHN_RP_ID:localhost}
    rp-name: QuantGen
  razorpay:
    # Test-mode keys only (PRD 7.9). Empty = top-ups answer 503 GATEWAY_UNAVAILABLE. Secrets never leave the server.
    key-id: ${QG_RAZORPAY_KEY_ID:}
    key-secret: ${QG_RAZORPAY_KEY_SECRET:}
    webhook-secret: ${QG_RAZORPAY_WEBHOOK_SECRET:}
    base-url: https://api.razorpay.com/v1
  rate-limit:
    # Per-IP limits on /api/v1/auth/** (RateLimitFilter). Only switch off for automated e2e runs.
    enabled: ${QG_RATE_LIMIT_ENABLED:true}
