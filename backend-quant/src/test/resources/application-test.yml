qg:
  agent:
    secret: test-only-agent-secret
    # FakeAgent (support) listens here during CopilotIT.
    url: http://localhost:18091
  crypto:
    field-key: dGVzdC1vbmx5LWZpZWxkLWtleS1ub3QtZm9yLXByb2Q=
    index-key: dGVzdC1vbmx5LWluZGV4LWtleS1ub3QtZm9yLXByb2Q=
  jwt:
    # Test-only secret.
    secret: dGVzdC1vbmx5LXF1YW50Z2VuLWp3dC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0wMTIzNDU2Nzg5
  auth:
    # Test-only: cheap hashes keep integration tests fast. Production and dev use the default cost 12.
    bcrypt-cost: 4
  market:
    # Tests drive PriceSimulator.tick() explicitly for deterministic prices.
    simulator-enabled: false
  rate-limit:
    # Integration tests register and log in many users from 127.0.0.1; RateLimitFilterTest covers the limiter.
    enabled: false
  razorpay:
    # Test-only values; Razorpay's REST API is replaced by FakeRazorpayApi.
    key-id: rzp_test_fake000000
    key-secret: test-key-secret
    webhook-secret: test-webhook-secret
  risk:
    # Fraud rules read the wall clock (00:00–05:00 IST) and history, so other tests would flake; RiskIT turns them on.
    enabled: false
    # Tests call FraudMemoWorker.runOnce() and UnderwritingWorker.runOnce() themselves.
    memo-poll-millis: 3600000
    underwriting-poll-millis: 3600000
    reconcile-poll-millis: 3600000
    memo-initial-millis: 3600000
  storage:
    loan-documents-dir: target/test-loan-documents
