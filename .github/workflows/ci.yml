# QuantGen CI (PRD M6, ARCHITECTURE §11): test both apps, build and scan the images,
# and push them to GHCR on main. Deploy is a separate, manually triggered workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, types, unit, e2e, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend-quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-quant/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx prettier --check src e2e
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
      - name: Production bundle carries no mocks or demo credentials
        run: |
          if grep -rlE 'mockServiceWorker|Demo@1234|Admin@1234|Customer@1234' dist/; then
            echo "::error::mock code or seed credentials found in the production bundle"; exit 1
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end (MSW mocks, desktop + mobile, a11y audit)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend-quant/playwright-report
            frontend-quant/test-results
          retention-days: 7

  backend:
    name: Backend (unit + integration with Testcontainers)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Verify (Docker is available on the runner for Testcontainers)
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: backend-quant/target/*-reports
          retention-days: 7

  agent:
    name: Agent (agent-quant unit tests; no model calls, no API key in CI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent-quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-surefire-reports
          path: agent-quant/target/*-reports
          retention-days: 7

  images:
    name: Images (build, scan, push on main)
    needs: [frontend, backend, agent]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - { name: web, context: frontend-quant }
          - { name: api, context: backend-quant }
          - { name: agent, context: agent-quant }
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lowercase)
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app.name }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/quantgen-${APP}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}
      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
